    <!--
      The page is client-rendered, so a crawler's first fetch carries no text.
      This block is the one machine-readable description of the business that
      survives that, and is what Google reads for the knowledge panel.

      TODO (client to supply): replace the telephone, email and streetAddress
      placeholders with the real details, then submit the domain in Google
      Search Console. Deliberately left empty rather than invented — wrong
      contact data in schema is worse than none.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://jkfashionembroidery.com/#organization",
        "name": "JK Fashion",
        "url": "https://jkfashionembroidery.com/",
        "logo": "https://jkfashionembroidery.com/favicon.png",
        "image": "https://jkfashionembroidery.com/jk_fashion_img1-full.jpg",
        "description": "Manufacturers of schiffli embroidered fabrics, cotton and net laces, and crochet trims for garment and fabric exporters.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        },
        "knowsAbout": [
          "Schiffli embroidery",
          "Embroidered fabric manufacturing",
          "Cotton lace",
          "Net lace",
          "Crochet trims",
          "Garment export supply"
        ]
      }
    </script>
